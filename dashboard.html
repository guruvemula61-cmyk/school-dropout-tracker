<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - School Dropout Tracker</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><div class="nav" id="nav"></div>
<h1>Dashboard</h1>
<div class="grid"><div class="stat"><b id="t"></b><span>Total students</span></div><div class="stat low"><b id="a"></b><span>Average attendance</span></div>
<div class="stat high"><b id="r"></b><span>At-risk students</span></div><div class="stat critical"><b id="x"></b><span>Dropped out</span></div><div class="stat medium"><b id="i"></b><span>Active interventions</span></div></div>
<div class="card"><h2>🚨 Today's alerts</h2><div id="al"></div></div>
<div class="card"><h2>Students needing attention</h2><div class="tw"><table><tbody id="list"></tbody></table></div>
<a class="btn" href="risk.html">See full risk analysis</a> <a class="btn g" href="students.html">Add or edit students</a></div></div>
<script src="app.js"></script><script>
init('dashboard.html','employee');const d=DB.get();
const A=d.students.filter(s=>s.status=='Active'),ar=A.filter(s=>['critical','high'].includes(lvl(s))),al=A.filter(s=>streak(s)>=3).sort((a,b)=>streak(b)-streak(a));
$('t').textContent=d.students.length;$('a').textContent=(A.reduce((n,s)=>n+s.att,0)/(A.length||1)).toFixed(1)+'%';$('r').textContent=ar.length;
$('x').textContent=d.students.length-A.length;$('i').textContent=d.interventions.filter(i=>i.status=='Active').length;
$('al').innerHTML=al.slice(0,8).map(s=>{const n=streak(s);return `<div class="alert ${n>=5?'critical':'high'}"><span><b>${esc(s.name)}</b> (${s.id}, Class ${s.grade}) absent ${n} days in a row<br><small>${n>=5?'Critical: visit the home or call the parent today':'Red flag: send an SMS to the parent'}</small></span><span><a class="btn s" href="${sms(s)}">SMS</a><a class="btn s g" href="tel:${esc(s.phone)}">Call</a></span></div>`}).join('')+(al.length>8?`<small>+ ${al.length-8} more students absent 3+ days. See the Attendance page.</small>`:'')||'<p>No alerts today. Mark daily attendance to keep this updated.</p>';
$('list').innerHTML=ar.sort((a,b)=>risk(b)-risk(a)).slice(0,10).map(s=>`<tr><td>${esc(s.name)}<br><small>${s.id} · Class ${s.grade} · ${esc(s.village)}</small></td><td>${s.att}%</td><td><span class="badge ${lvl(s)}">${lvl(s)}</span></td><td><a class="btn s" href="${sms(s)}">SMS parent</a><a class="btn s g" href="tel:${esc(s.phone)}">Call</a></td></tr>`).join('')+(ar.length>10?`<tr><td colspan="4"><small>Showing top 10 of ${ar.length}. See the full list in Dropout Risk.</small></td></tr>`:'')||'<tr><td>No at-risk students right now.</td></tr>';
</script></body></html>
