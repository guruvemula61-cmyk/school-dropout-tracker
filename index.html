<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Dropout Tracking System</title><link rel="stylesheet" href="style.css"></head><body>
<div class="hero"><h1>🎓 School Dropout Tracking System</h1><p>Early intervention and student success platform</p></div>
<div class="login">
<div class="card"><h2>Employee Login</h2>
<form id="fe" autocomplete="off"><label for="eid">Employee ID</label><input id="eid" value="EMP001">
<label for="epw">Password</label><input id="epw" type="password" value="admin123">
<button class="btn ok" style="width:100%">Employee Login</button></form>
<div class="msg" id="m1"></div><small>Demo: EMP001 / admin123 (already filled, just click Login)</small></div>
<div class="card"><h2>Parent Login</h2>
<form id="fp" autocomplete="off"><label for="pid">Student ID</label><input id="pid" value="ST001">
<label for="ppw">Password</label><input id="ppw" type="password" value="parent123">
<button class="btn" style="width:100%">Parent Login</button></form>
<div class="msg" id="m2"></div><small>Demo: ST001 / parent123 (already filled, just click Login)</small></div></div>
<script src="app.js"></script><script>
function go(role,i,p){
 const id=$(i).value.trim().toUpperCase(),pw=$(p).value.trim(),m=$(role=='employee'?'m1':'m2');
 let ok=false;
 if(role=='employee') ok=['EMP001','ADMIN'].includes(id)&&['admin123','admin'].includes(pw);
 else ok=DB.get().students.some(s=>s.id==id)&&['parent123','parent'].includes(pw);
 if(!ok){m.textContent='Wrong ID or password. Use the demo login shown below the button.';return}
 sessionStorage.setItem('u',JSON.stringify({role,id}));
 location.href=role=='employee'?'dashboard.html':'parent.html'}
$('fe').onsubmit=e=>{e.preventDefault();go('employee','eid','epw')};
$('fp').onsubmit=e=>{e.preventDefault();go('parent','pid','ppw')};
</script></body></html>
