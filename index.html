<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Dropout Tracking System</title><link rel="stylesheet" href="style.css"></head><body>
<div class="hero"><h1>🎓 School Dropout Tracking System</h1><p>Early intervention and student success platform</p></div>
<div class="login">
<div class="card"><h2>Employee Login</h2><label for="eid">Employee ID</label><input id="eid" placeholder="EMP001"><label for="epw">Password</label><input id="epw" type="password" placeholder="admin123">
<button class="btn ok" style="width:100%" onclick="go('employee','eid','epw')">Employee Login</button><div class="msg" id="m1"></div><small>Demo: EMP001 / admin123</small></div>
<div class="card"><h2>Parent Login</h2><label for="pid">Student ID</label><input id="pid" placeholder="ST001"><label for="ppw">Password</label><input id="ppw" type="password" placeholder="parent123">
<button class="btn" style="width:100%" onclick="go('parent','pid','ppw')">Parent Login</button><div class="msg" id="m2"></div><small>Demo: ST001 / parent123</small></div></div>
<script src="app.js"></script><script>
function go(role,i,p){const id=$(i).value.trim().toUpperCase(),pw=$(p).value.trim(),m=$(role=='employee'?'m1':'m2');
 const ok=role=='employee'?(id=='EMP001'&&pw=='admin123'):(DB.get().students.some(s=>s.id==id)&&pw=='parent123');
 if(!ok){m.textContent='Wrong ID or password. Check the demo login below the button.';return}
 sessionStorage.setItem('u',JSON.stringify({role,id}));location.href=role=='employee'?'dashboard.html':'parent.html'}
</script></body></html>
